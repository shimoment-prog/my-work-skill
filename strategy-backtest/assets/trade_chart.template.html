<div id="eth-three-day-review">
  <header class="review-heading"><h2 id="eth-review-heading">策略回测 · 逐笔复核</h2><div id="eth-review-period" class="text-small text-muted"></div></header>
  <div class="viz-controls">
    <label class="form-label" for="eth-trade-select">交易<select id="eth-trade-select" aria-label="选择交易"></select></label>
    <button id="eth-previous" type="button">上一笔</button><button id="eth-next" type="button">下一笔</button>
    <button id="eth-all" type="button">区间全图</button><button id="eth-show-ledger" type="button">逐笔交易表</button>
    <label class="form-check"><input id="eth-all-boxes" type="checkbox">显示所有仓位框</label>
  </div>
  <div id="eth-indicator-legend" class="viz-row review-legend text-small"></div>
  <div class="text-small text-muted">▲ 多单入场　▼ 空单入场　● 平仓　蓝框：策略提供的信号 K（若有）</div>
  <div id="eth-key-summary" class="review-key-summary text-small tabular-nums" aria-live="polite"></div>
  <div id="eth-readout" class="text-small tabular-nums" aria-label="K线与指标读数"></div>
  <div class="review-price-wrap"><div id="eth-price-chart" role="img" aria-label="价格K线、策略指标与交易位置"></div><svg id="eth-position-overlay" class="review-overlay" aria-hidden="true"></svg></div>
  <div id="eth-oscillator-panes"></div>
  <div id="eth-selected-heading" class="review-selected" aria-live="polite"></div>
  <div id="eth-selected-prices" class="viz-row text-small tabular-nums"></div>
  <div id="eth-selected-timing" class="text-small text-muted"></div>
  <div class="text-small text-muted">仓位框显示入场时的止盈止损；缺失价格不补造。若提供移动水平，虚线显示其变化。退出区间末端用于画框时，不代表精确成交时刻。</div>
  <div class="review-check-wrap"><table class="table review-check-table" aria-label="策略逐笔条件检查"><thead><tr><th>策略条件</th><th>实际值</th><th>核对</th></tr></thead><tbody id="eth-checks"></tbody></table></div>
  <div id="eth-review-summary" class="text-small text-muted"></div>
  <section id="eth-trade-ledger" class="review-ledger" aria-labelledby="eth-ledger-heading">
    <div class="viz-row review-ledger-heading"><h3 id="eth-ledger-heading">逐笔交易表</h3><button id="eth-export-ledger" type="button">导出 CSV</button></div>
    <div id="eth-ledger-sizing" class="text-small tabular-nums"></div>
    <div id="eth-ledger-note" class="text-small text-muted"></div>
    <div class="review-ledger-scroll" role="region" aria-label="逐笔交易明细，窄屏可左右滚动" tabindex="0">
      <table class="table review-ledger-table" aria-label="交易价格、成本、净盈亏与资金余额"><thead><tr><th>交易</th><th id="eth-time-header">进场时间</th><th>进场价</th><th>止损点</th><th>止盈点</th><th>平仓价</th><th>结果（净）</th><th>盈利（净）</th><th>亏损（净）</th><th>手续费</th><th>其他成本</th><th id="eth-balance-header">交易后金额</th></tr></thead><tbody id="eth-ledger-rows"></tbody><tfoot id="eth-ledger-totals"></tfoot></table>
    </div>
    <div id="eth-ledger-summary" class="text-small tabular-nums"></div>
    <div class="text-small text-muted">Win/Loss 使用扣除全部已建模成本的净盈亏。费用列用于核对，无需再次扣除。Open 单没有已实现净盈亏或平仓后余额。</div>
  </section>
  <section id="eth-limitations" class="review-limitations text-small text-muted"></section>
  <div class="text-small text-muted">图表：<a href="https://www.tradingview.com/lightweight-charts/" target="_blank" rel="noopener noreferrer">TradingView Lightweight Charts™</a>。仓位框由本地绘制。</div>
  <div id="eth-review-error" role="alert" hidden></div>
</div>
<style>

#eth-three-day-review .review-price-wrap{position:relative;isolation:isolate;height:390px;min-width:0;overflow:hidden}#eth-three-day-review #eth-price-chart{height:390px;width:100%;min-width:0}#eth-three-day-review .review-overlay{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none;overflow:hidden}#eth-three-day-review .review-oscillator{display:grid;gap:3px;margin-top:8px;min-width:0}#eth-three-day-review .review-oscillator-chart{height:145px;min-width:0;width:100%}#eth-three-day-review .review-selected{font-weight:600}#eth-three-day-review .review-check-wrap{min-width:0;overflow-wrap:anywhere}#eth-three-day-review .table{width:100%;border-collapse:collapse;font-size:13px}#eth-three-day-review .table th,#eth-three-day-review .table td{border-bottom:1px solid var(--border,#303b4c);padding:8px 10px;text-align:left;vertical-align:top}#eth-three-day-review .table th{color:var(--muted-foreground,#96a4b6);font-weight:600}#eth-three-day-review .review-check-table td:first-child{width:25%}#eth-three-day-review .review-check-table td:last-child{width:60px;white-space:nowrap}#eth-three-day-review .review-pass,#eth-three-day-review .review-ledger-win{color:var(--green,#39c598)}#eth-three-day-review .review-fail,#eth-three-day-review .review-ledger-loss{color:var(--red,#f2737e)}
#eth-three-day-review .review-ledger{display:grid;gap:10px;min-width:0;margin-top:14px;padding-top:18px;border-top:1px solid var(--border,#303b4c);scroll-margin-top:18px}#eth-three-day-review .review-ledger-heading{justify-content:space-between}#eth-three-day-review .review-ledger-scroll{width:100%;max-width:100%;min-width:0;overflow-x:auto;border:1px solid var(--border,#303b4c);border-radius:7px}#eth-three-day-review .review-ledger-table{min-width:1250px;font-variant-numeric:tabular-nums}#eth-three-day-review .review-ledger-table :is(th,td){white-space:nowrap;text-align:right;overflow-wrap:normal;width:auto;padding:9px 10px}#eth-three-day-review .review-ledger-table :is(th,td):first-child,#eth-three-day-review .review-ledger-table :is(th,td):nth-child(2){text-align:left}#eth-three-day-review .review-ledger-table thead,#eth-three-day-review .review-ledger-table tfoot{background:var(--review-surface)}#eth-three-day-review .review-ledger-table tbody tr{cursor:pointer}#eth-three-day-review .review-ledger-table tbody tr[data-selected=true]{background:color-mix(in srgb,var(--blue,#7caef5) 13%,transparent)}#eth-three-day-review .review-ledger-link{padding:3px 7px;background:transparent;white-space:nowrap}#eth-three-day-review .review-ledger-link[aria-current=true]{border-color:var(--blue,#7caef5)}#eth-three-day-review .review-ledger-reason{display:block;font-size:11px;line-height:1.4}#eth-three-day-review #eth-review-error{color:var(--red,#f2737e);border:1px solid currentColor;padding:12px}#eth-three-day-review .review-limitations{overflow-wrap:anywhere}#eth-three-day-review a{color:var(--blue,#7caef5)}
@media(max-width:600px){#eth-three-day-review h2{font-size:19px}#eth-three-day-review .form-label{width:100%}#eth-three-day-review .review-price-wrap,#eth-three-day-review #eth-price-chart{height:330px}#eth-three-day-review .review-oscillator-chart{height:130px}#eth-three-day-review .review-check-table :is(th,td){padding:7px 5px;font-size:12px}#eth-three-day-review .viz-controls{gap:8px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
(() => {
  const root=document.getElementById('eth-three-day-review'),q=id=>root.querySelector('#'+id),data=__TRADE_DATA_JSON__;
  try {
    if(!window.LightweightCharts) throw new Error('内嵌图表组件未加载，请检查文件完整性。');
    const LC=window.LightweightCharts,meta=data.meta,summary=data.summary,bars=data.candles,trades=data.trades,indicators=data.indicators||[];
    if(!bars.length) throw new Error('结果没有可显示的 K 线。');
    const valid=n=>typeof n==='number'&&Number.isFinite(n),currency=String(meta.currency),priceCurrency=String(meta.price_currency||meta.currency),quantityUnit=String(meta.quantity_unit||''),tz=String(meta.timezone||'UTC');
    const balanceLabel=String(meta.balance_label||(meta.accounting_mode==='closed_pnl'?'已平仓累计余额':meta.balance_basis==='equity'?'账户权益':meta.balance_basis==='cash'?'账户现金':'账户金额'));
    q('eth-balance-header').textContent='交易后'+balanceLabel;
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const digitsForStep=(step,fallback)=>{if(!valid(step)||step<=0)return fallback;const [m,e='0']=String(step).toLowerCase().split('e');return Math.max(0,Math.min(12,(m.split('.')[1]?.length||0)-Number(e)));};
    const priceDigits=digitsForStep(meta.price_step,4),qtyDigits=digitsForStep(meta.quantity_step,6);
    const fmt=(n,d=2)=>valid(n)?n.toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d}):'—',price=n=>fmt(n,priceDigits),signed=n=>(n>0?'+':'')+fmt(n);
    const dateFormatter=new Intl.DateTimeFormat('zh-CN',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
    const tickFormatter=new Intl.DateTimeFormat('zh-CN',{timeZone:tz,month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
    const fmtDate=t=>valid(t)?dateFormatter.format(new Date(t*1000)):'—';
    const fileDate=t=>{const p=new Intl.DateTimeFormat('en-US',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date(t*1000));const get=k=>p.find(x=>x.type===k).value;return `${get('year')}-${get('month')}-${get('day')}`;};
    const stepMatch=String(meta.interval).match(/^(\d+)([smhdw])$/),units={s:1,m:60,h:3600,d:86400,w:604800};
    const stepSeconds=stepMatch?Number(stepMatch[1])*units[stepMatch[2]]:(bars.length>1?bars[1].time-bars[0].time:60);
    const candleByTime=new Map(bars.map((b,i)=>[b.time,{...b,index:i}]));
    const valueMaps=new Map(indicators.map(ind=>[ind.id,new Map(ind.values.map(v=>[v.time,v.value]))]));
    const logical=t=>{let lo=0,hi=bars.length;while(lo<hi){const mid=(lo+hi)>>1;if(bars[mid].time<t)lo=mid+1;else hi=mid;}if(lo<bars.length&&bars[lo].time===t)return lo;if(lo===0)return (t-bars[0].time)/stepSeconds;if(lo===bars.length)return bars.length-1+(t-bars[bars.length-1].time)/stepSeconds;return lo-1+(t-bars[lo-1].time)/(bars[lo].time-bars[lo-1].time);};
    const css=name=>getComputedStyle(root).getPropertyValue(name).trim();
    const palette=()=>({background:css('--background')||'#10141c',text:css('--foreground')||'#edf2f7',muted:css('--muted-foreground')||'#96a4b6',grid:css('--border')||'#303b4c',green:css('--green')||'#39c598',red:css('--red')||'#f2737e',blue:css('--blue')||'#7caef5',orange:css('--orange')||'#f5a544',purple:css('--purple')||'#b7a1f5'});
    let colors=palette(),selectedIndex=trades.length?0:-1,allView=!trades.length,syncing=false,pending=false;
    const saved=window.openai?.widgetState,restore=saved?.privateContent||saved||{};
    if(trades.length&&Number.isInteger(restore.tradeIndex))selectedIndex=Math.max(0,Math.min(trades.length-1,restore.tradeIndex));
    q('eth-all-boxes').checked=Boolean(restore.allBoxes);
    q('eth-review-heading').textContent=`${meta.strategy_name} · ${meta.symbol}`;
    q('eth-review-period').textContent=`${meta.market} · ${meta.interval} · ${fmtDate(meta.start_time)} — ${fmtDate(meta.end_time)}（结束边界）· ${tz}`;
    q('eth-time-header').textContent=`进场时间（${tz}）`;
    q('eth-ledger-sizing').textContent=`初始资金 ${fmt(meta.initial_capital)} ${currency}；${meta.sizing?.description||`${meta.sizing?.mode||'未说明'} ${meta.sizing?.value??''}；杠杆 ${meta.sizing?.leverage??'未说明'}`}`;
    q('eth-ledger-note').textContent=`价格单位 ${priceCurrency}；账户金额单位 ${currency}；数量单位 ${quantityUnit||'由策略声明'}。${meta.balance_description||''} 显示值已四舍五入，CSV 最多保留9位小数。点击交易编号回到对应 K 线。`;
    q('eth-review-summary').textContent=`已平仓 ${summary.closed_trades} 笔 · Win ${summary.wins} / Loss ${summary.losses} / Flat ${summary.flats} · 净胜率 ${valid(summary.win_rate_percent)?fmt(summary.win_rate_percent)+'%':'不适用'} · 已平仓净盈亏 ${signed(summary.closed_net_pnl)} ${currency} · ${balanceLabel} ${fmt(summary.closed_balance)} ${currency}${valid(summary.final_equity)?` · 期末权益 ${fmt(summary.final_equity)} ${currency}`:''}`;
    q('eth-limitations').innerHTML=`<div>数据来源：${esc(meta.source_description)}</div>${(meta.limitations||[]).length?'<ul>'+meta.limitations.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':''}`;
    const colorFor=(ind,index)=>ind.color||[colors.orange,colors.blue,colors.purple,colors.green,colors.red][index%5];
    q('eth-indicator-legend').innerHTML=indicators.length?indicators.map((ind,i)=>`<span><i class="review-swatch" style="background:${esc(colorFor(ind,i))}"></i>${esc(ind.name)}${ind.pane==='oscillator'?'（独立窗）':''}</span>`).join(''):'<span class="text-muted">本策略未提供指标叠加</span>';
    const priceNode=q('eth-price-chart'),overlay=q('eth-position-overlay'),select=q('eth-trade-select');
    const options=node=>({width:node.clientWidth,height:node.clientHeight,layout:{background:{type:LC.ColorType.Solid,color:colors.background},textColor:colors.text,fontSize:12},grid:{vertLines:{color:colors.grid},horzLines:{color:colors.grid}},rightPriceScale:{borderColor:colors.grid,minimumWidth:76,scaleMargins:{top:.12,bottom:.12}},timeScale:{borderColor:colors.grid,timeVisible:true,secondsVisible:false,barSpacing:8,minBarSpacing:.01,rightOffset:3,tickMarkFormatter:t=>tickFormatter.format(new Date(Number(t)*1000))},localization:{locale:'zh-CN',timeFormatter:t=>fmtDate(Number(t))},crosshair:{mode:LC.CrosshairMode.Normal},handleScroll:{mouseWheel:true,pressedMouseMove:true,horzTouchDrag:true,vertTouchDrag:false},handleScale:{mouseWheel:true,pinch:true,axisPressedMouseMove:{time:true,price:true}}});
    const priceChart=LC.createChart(priceNode,options(priceNode)),panes=[{chart:priceChart,node:priceNode,series:[]}];
    const candleSeries=priceChart.addCandlestickSeries({priceFormat:{type:'price',precision:priceDigits,minMove:valid(meta.price_step)?meta.price_step:Math.pow(10,-priceDigits)},upColor:colors.green,downColor:colors.red,wickUpColor:colors.green,wickDownColor:colors.red,borderVisible:false,priceLineVisible:false,autoscaleInfoProvider:original=>{const range=original(),t=trades[selectedIndex];if(!range||!t||allView)return range;const levels=[t.entry_price,t.stop,t.target,...(t.risk_levels||[]).flatMap(x=>[x.stop,x.target])].filter(valid);return {...range,priceRange:{minValue:Math.min(range.priceRange.minValue,...levels),maxValue:Math.max(range.priceRange.maxValue,...levels)}};}});
    candleSeries.setData(bars.map(b=>({time:b.time,open:b.open,high:b.high,low:b.low,close:b.close})));
    panes[0].series.push({series:candleSeries,field:'close'});
    const indicatorSeries=[];
    indicators.forEach((ind,index)=>{let pane=panes[0];if(ind.pane==='oscillator'){const box=document.createElement('section');box.className='review-oscillator';const heading=document.createElement('div');heading.className='text-small';heading.textContent=ind.name;const node=document.createElement('div');node.className='review-oscillator-chart';node.setAttribute('role','img');node.setAttribute('aria-label',ind.name+'独立指标窗');box.append(heading,node);q('eth-oscillator-panes').append(box);pane={chart:LC.createChart(node,options(node)),node,series:[]};panes.push(pane);}const series=pane.chart.addLineSeries({color:colorFor(ind,index),lineWidth:2,priceLineVisible:false,lastValueVisible:true,crosshairMarkerVisible:false});const values=valueMaps.get(ind.id);series.setData(bars.map(b=>valid(values.get(b.time))?{time:b.time,value:values.get(b.time)}:{time:b.time}));const levels=(ind.levels||[]).filter(valid).map(level=>series.createPriceLine({price:level,color:colors.muted,lineStyle:LC.LineStyle.Dashed,lineWidth:1,axisLabelVisible:true}));pane.series.push({series,values});indicatorSeries.push({ind,index,series,levels});});
    const markerTime=t=>{const i=Math.max(0,Math.min(bars.length-1,Math.floor(logical(t))));return bars[i].time;};
    function markers(){const list=[];trades.forEach(t=>{list.push({time:markerTime(t.entry_time),position:t.direction==='long'?'belowBar':'aboveBar',color:t.direction==='long'?colors.green:colors.red,shape:t.direction==='long'?'arrowUp':'arrowDown',text:`#${t.id}${t.direction==='long'?'多':'空'}入`,size:1});const end=valid(t.exit_time)?t.exit_time:t.exit_bar_start;if(t.status==='closed'&&valid(end))list.push({time:markerTime(end),position:t.direction==='long'?'aboveBar':'belowBar',color:colors.muted,shape:'circle',text:`#${t.id}平`,size:.7});});list.sort((a,b)=>a.time-b.time);candleSeries.setMarkers(list);}
    markers();
    select.innerHTML=trades.length?trades.map((t,i)=>`<option value="${i}">#${esc(t.id)} ${t.direction==='long'?'多':'空'} · ${esc(fmtDate(t.entry_time))}${t.status==='open'?' · Open':''}</option>`).join(''):'<option>区间内无交易</option>';
    select.disabled=!trades.length;
    const result=t=>t.status==='open'?'Open':t.net_pnl>0?'Win':t.net_pnl<0?'Loss':'Flat';
    const records=trades.map((t,index)=>({t,index,closed:t.status==='closed',profit:t.status==='closed'?Math.max(0,t.net_pnl):null,loss:t.status==='closed'?Math.max(0,-t.net_pnl):null}));
    q('eth-ledger-rows').innerHTML=records.map(({t,index,closed,profit,loss})=>`<tr data-trade-index="${index}" data-trade-id="${esc(t.id)}" data-net-pnl="${closed?t.net_pnl:''}" data-balance-after="${closed?t.balance_after:''}"><td><button class="review-ledger-link" data-ledger-trade="${index}" type="button">#${esc(t.id)} ${t.direction==='long'?'多':'空'}</button></td><td>${esc(fmtDate(t.entry_time))}</td><td>${price(t.entry_price)}</td><td>${price(t.stop)}</td><td>${price(t.target)}</td><td>${price(t.exit_price)}</td><td class="${result(t)==='Win'?'review-ledger-win':result(t)==='Loss'?'review-ledger-loss':''}">${result(t)}<span class="review-ledger-reason text-muted">${esc(t.exit_reason||'')}</span></td><td class="${profit>0?'review-ledger-win':''}">${fmt(profit,4)}</td><td class="${loss>0?'review-ledger-loss':''}">${fmt(loss,4)}</td><td>${fmt(t.fees,4)}</td><td>${fmt(t.other_costs,4)}</td><td>${closed?fmt(t.balance_after):'—'}</td></tr>`).join('');
    if(!trades.length)q('eth-ledger-rows').innerHTML='<tr><td colspan="12">区间内没有交易</td></tr>';
    const profit=records.reduce((s,r)=>s+(r.profit||0),0),loss=records.reduce((s,r)=>s+(r.loss||0),0);
    q('eth-ledger-totals').innerHTML=`<tr><th colspan="7">合计（净额）</th><td>${fmt(profit,4)}</td><td>${fmt(loss,4)}</td><td>${fmt(summary.total_fees,4)}</td><td>${fmt(summary.total_other_costs,4)}</td><td>${fmt(summary.closed_balance)}</td></tr>`;
    q('eth-ledger-summary').textContent=`累计盈利 ${fmt(profit,4)} ${currency} · 累计亏损 ${fmt(loss,4)} ${currency} · 净盈亏 ${signed(summary.closed_net_pnl)} ${currency}`;
    function saveState(){if(window.openai?.setWidgetState)Promise.resolve(window.openai.setWidgetState({modelContent:{strategy:meta.strategy_name,symbol:meta.symbol,selected_trade:trades[selectedIndex]?.id??null},privateContent:{tradeIndex:selectedIndex,allBoxes:q('eth-all-boxes').checked}})).catch(()=>{});}
    function details(){const t=trades[selectedIndex];q('eth-previous').disabled=selectedIndex<=0;q('eth-next').disabled=selectedIndex<0||selectedIndex>=trades.length-1;select.value=String(Math.max(0,selectedIndex));if(!t){q('eth-key-summary').textContent='此区间没有交易。K线和已提供指标仍可浏览。';q('eth-selected-heading').textContent='无选中交易';q('eth-selected-prices').textContent='';q('eth-selected-timing').textContent='';q('eth-checks').innerHTML='<tr><td colspan="3">没有交易条件记录。</td></tr>';return;}
      q('eth-key-summary').textContent=`#${t.id} ${t.direction==='long'?'做多':'做空'} · ${valid(t.key_time)?'信号K开盘 '+fmtDate(t.key_time)+' · ':''}入场 ${fmtDate(t.entry_time)} · ${result(t)}`;
      q('eth-selected-heading').textContent=`#${t.id} ${t.direction==='long'?'多单':'空单'} · ${t.status==='open'?'期末未平仓':result(t)}`;
      q('eth-selected-prices').innerHTML=[`进场 ${price(t.entry_price)}`,`止损 ${price(t.stop)}`,`止盈 ${price(t.target)}`,`平仓 ${price(t.exit_price)}`,`数量 ${fmt(t.quantity,qtyDigits)} ${quantityUnit}`,`手续费 ${fmt(t.fees,4)} ${currency}`,`其他成本 ${fmt(t.other_costs,4)} ${currency}`,`净盈亏 ${t.status==='closed'?signed(t.net_pnl):'—'} ${currency}`,`交易后${balanceLabel} ${t.status==='closed'?fmt(t.balance_after):'—'} ${currency}`].map(x=>'<span>'+esc(x)+'</span>').join('');
      q('eth-selected-timing').textContent=t.status==='open'?'期末仍持仓。':valid(t.exit_time)?`平仓时刻 ${fmtDate(t.exit_time)}`:valid(t.exit_bar_start)&&valid(t.exit_bar_end)?`退出发生于 ${fmtDate(t.exit_bar_start)} — ${fmtDate(t.exit_bar_end)}；K内精确时刻未知。`:'未提供精确平仓时刻或退出K区间。';
      q('eth-checks').innerHTML=(t.checks||[]).length?t.checks.map(c=>`<tr><td>${esc(c.label)}</td><td>${esc(c.value)}</td><td class="${c.pass?'review-pass':'review-fail'}">${c.pass?'通过':'失败'}</td></tr>`).join(''):'<tr><td colspan="3">此交易未提供逐项条件检查。</td></tr>';
      q('eth-ledger-rows').querySelectorAll('[data-trade-index]').forEach((row,i)=>{row.dataset.selected=String(i===selectedIndex);row.querySelector('button').setAttribute('aria-current',String(i===selectedIndex));});
    }
    const x=t=>priceChart.timeScale().logicalToCoordinate(logical(t));
    const svg=(tag,attrs,parent=overlay)=>{const n=document.createElementNS('http://www.w3.org/2000/svg',tag);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,String(v)));parent.append(n);return n;};
    const text=(content,attrs,parent)=>{const n=svg('text',attrs,parent);n.textContent=content;return n;};
    const ending=t=>valid(t.exit_time)?t.exit_time:valid(t.exit_bar_end)?t.exit_bar_end:valid(meta.end_time)?meta.end_time:bars.at(-1).time+stepSeconds;
    function drawOverlay(){pending=false;const width=priceNode.clientWidth,height=priceNode.clientHeight;overlay.setAttribute('viewBox',`0 0 ${width} ${height}`);overlay.replaceChildren();const plotRight=width-76,plotBottom=height-28;if(plotRight<=0)return;const defs=svg('defs',{}),clip=svg('clipPath',{id:'review-trade-clip'},defs);svg('rect',{x:0,y:0,width:plotRight,height:plotBottom},clip);const group=svg('g',{'clip-path':'url(#review-trade-clip)'});const shown=q('eth-all-boxes').checked?trades:(trades[selectedIndex]?[trades[selectedIndex]]:[]);
      shown.forEach(t=>{const start=x(t.entry_time),finish=x(ending(t));if(start==null||finish==null)return;const a=Math.min(start,finish),w=Math.max(2,Math.abs(finish-start)),yEntry=candleSeries.priceToCoordinate(t.entry_price),yStop=valid(t.stop)?candleSeries.priceToCoordinate(t.stop):null,yTarget=valid(t.target)?candleSeries.priceToCoordinate(t.target):null;const g=svg('g',{'data-trade-id':t.id},group);const active=trades[selectedIndex]===t,opacity=active?.17:.09;
        if(yEntry!=null&&yStop!=null&&yTarget!=null){svg('rect',{x:a,y:Math.min(yEntry,yTarget),width:w,height:Math.max(1,Math.abs(yEntry-yTarget)),fill:colors.green,opacity},g);svg('rect',{x:a,y:Math.min(yEntry,yStop),width:w,height:Math.max(1,Math.abs(yEntry-yStop)),fill:colors.red,opacity},g);}
        [[t.entry_price,colors.blue,'入场'],[t.stop,colors.red,'止损'],[t.target,colors.green,'止盈']].forEach(([level,color,label])=>{if(!valid(level))return;const yy=candleSeries.priceToCoordinate(level);if(yy==null)return;svg('line',{x1:start,y1:yy,x2:finish,y2:yy,stroke:color,'stroke-width':active?1.5:1,'stroke-dasharray':label==='入场'?'':'4 3'},g);if(active)text(`${label} ${price(level)}`,{x:Math.max(3,Math.min(start+5,plotRight-130)),y:Math.max(13,Math.min(yy-4,plotBottom-3)),fill:color,'font-size':11,'paint-order':'stroke',stroke:colors.background,'stroke-width':3},g);});
        if(yEntry!=null)svg('circle',{cx:start,cy:yEntry,r:3.5,fill:colors.blue,stroke:colors.background,'stroke-width':1,'data-role':'entry-point'},g);
        if(t.status==='closed'&&valid(t.exit_price)){const yy=candleSeries.priceToCoordinate(t.exit_price);if(yy!=null)svg('circle',{cx:finish,cy:yy,r:3,fill:colors.muted,'data-role':'exit-point'},g);}
        for(const [field,color]of[['stop',colors.red],['target',colors.green]]){let last=null;for(const level of t.risk_levels||[]){if(!valid(level[field])||!valid(level.time))continue;const xx=x(level.time),yy=candleSeries.priceToCoordinate(level[field]);if(xx==null||yy==null)continue;if(last)svg('path',{d:`M${last.x},${last.y}H${xx}V${yy}`,fill:'none',stroke:color,'stroke-width':2,'stroke-dasharray':'3 2','data-role':'risk-level'},g);last={x:xx,y:yy};}if(last)svg('line',{x1:last.x,y1:last.y,x2:finish,y2:last.y,stroke:color,'stroke-width':2,'stroke-dasharray':'3 2','data-role':'risk-level'},g);}
      });const t=trades[selectedIndex];if(t&&valid(t.key_time)){const b=candleByTime.get(t.key_time),xx=x(t.key_time);if(b&&xx!=null){const hi=candleSeries.priceToCoordinate(b.high),lo=candleSeries.priceToCoordinate(b.low),next=x(t.key_time+stepSeconds);if(hi!=null&&lo!=null){const w=Math.max(7,Math.min(26,Math.abs((next??xx+12)-xx)*.8));svg('rect',{x:xx-w/2,y:hi-4,width:w,height:Math.max(9,lo-hi+8),fill:'none',stroke:colors.blue,'stroke-width':2,'data-role':'key-candle-highlight'},group);text('策略信号 K',{x:Math.max(3,Math.min(xx+5,plotRight-100)),y:18,fill:colors.blue,'font-size':11,'paint-order':'stroke',stroke:colors.background,'stroke-width':3},group);}}}}
    function schedule(){if(!pending){pending=true;requestAnimationFrame(()=>requestAnimationFrame(drawOverlay));}}
    function focus(remember=true){const t=trades[selectedIndex];allView=false;if(t){const center=logical(valid(t.key_time)?t.key_time:t.entry_time),end=logical(ending(t));priceChart.timeScale().setVisibleLogicalRange({from:Math.max(-1,center-20),to:Math.min(bars.length+4,Math.max(center+25,end+12))});}else priceChart.timeScale().fitContent();details();schedule();if(remember)saveState();}
    function full(){allView=true;priceChart.timeScale().fitContent();schedule();}
    panes.forEach(pane=>{pane.chart.timeScale().subscribeVisibleLogicalRangeChange(range=>{if(syncing||!range)return;syncing=true;panes.forEach(other=>{if(other!==pane)other.chart.timeScale().setVisibleLogicalRange(range);});syncing=false;schedule();});pane.chart.subscribeCrosshairMove(param=>{if(!valid(Number(param.time))||param.time==null)return;const time=Number(param.time),b=candleByTime.get(time);if(!b)return;q('eth-readout').textContent=`${fmtDate(time)}　开 ${price(b.open)}　高 ${price(b.high)}　低 ${price(b.low)}　收 ${price(b.close)}${indicators.map(ind=>`　${ind.name} ${fmt(valueMaps.get(ind.id).get(time),4)}`).join('')}`;if(syncing)return;syncing=true;panes.forEach(other=>{if(other===pane)return;const first=other.series[0],value=first.field?b[first.field]:first.values.get(time);if(valid(value))other.chart.setCrosshairPosition(value,time,first.series);else other.chart.clearCrosshairPosition();});syncing=false;});});
    const choose=i=>{selectedIndex=i;focus();};
    select.addEventListener('change',()=>choose(Number(select.value)));q('eth-previous').addEventListener('click',()=>choose(Math.max(0,selectedIndex-1)));q('eth-next').addEventListener('click',()=>choose(Math.min(trades.length-1,selectedIndex+1)));q('eth-all').addEventListener('click',full);q('eth-all-boxes').addEventListener('change',()=>{schedule();saveState();});q('eth-show-ledger').addEventListener('click',()=>q('eth-trade-ledger').scrollIntoView({behavior:'smooth',block:'start'}));q('eth-ledger-rows').addEventListener('click',event=>{const row=event.target.closest('[data-trade-index]');if(!row)return;choose(Number(row.dataset.tradeIndex));q('eth-key-summary').scrollIntoView({behavior:'smooth',block:'start'});});
    priceChart.subscribeClick(param=>{if(param.time==null)return;const time=Number(param.time),index=trades.findIndex(t=>t.key_time===time||markerTime(t.entry_time)===time||(valid(t.exit_time??t.exit_bar_start)&&markerTime(t.exit_time??t.exit_bar_start)===time));if(index>=0)choose(index);});
    q('eth-export-ledger').addEventListener('click',()=>{const n=v=>valid(v)?String(Number(v.toFixed(9))):v??'',cell=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const header=['编号','方向',`进场时间（${tz}）`,'进场价','止损','止盈','平仓价','结果（净）',`盈利${currency}`,`亏损${currency}`,`手续费${currency}`,`其他成本${currency}`,`交易后${balanceLabel}${currency}`,`数量${quantityUnit}`,'入场名义仓位','占用保证金','杠杆'];const rows=records.map(({t,closed,profit,loss})=>[t.id,t.direction,fmtDate(t.entry_time),t.entry_price,t.stop,t.target,t.exit_price,result(t),profit,loss,t.fees,t.other_costs,closed?t.balance_after:null,t.quantity,t.entry_notional,t.margin_used,t.leverage]);const csv='\uFEFF'+[header,...rows].map(row=>row.map(v=>cell(n(v))).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const link=document.createElement('a');link.href=url;const slug=String(meta.symbol).replace(/[^a-zA-Z0-9._-]/g,'_');link.download=`${slug}-${fileDate(meta.start_time)}-${fileDate(meta.end_time-1)}-trades.csv`;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
    function theme(){colors=palette();const opt={layout:{background:{type:LC.ColorType.Solid,color:colors.background},textColor:colors.text},grid:{vertLines:{color:colors.grid},horzLines:{color:colors.grid}},rightPriceScale:{borderColor:colors.grid},timeScale:{borderColor:colors.grid}};panes.forEach(p=>p.chart.applyOptions(opt));candleSeries.applyOptions({upColor:colors.green,downColor:colors.red,wickUpColor:colors.green,wickDownColor:colors.red});indicatorSeries.forEach(({ind,index,series,levels})=>{series.applyOptions({color:colorFor(ind,index)});levels.forEach(line=>line.applyOptions({color:colors.muted}));});markers();schedule();}
    new MutationObserver(theme).observe(document.documentElement,{attributes:true,attributeFilter:['class','style','data-theme']});
    let previousWidth=priceNode.clientWidth;new ResizeObserver(()=>{panes.forEach(p=>p.chart.resize(p.node.clientWidth,p.node.clientHeight,true));if(previousWidth!==priceNode.clientWidth){previousWidth=priceNode.clientWidth;if(allView)full();else focus(false);}schedule();}).observe(root);
    ['pointermove','pointerup','wheel','touchmove'].forEach(event=>priceNode.addEventListener(event,schedule,{passive:true}));
    root.reviewState=()=>({tradeCount:trades.length,candleCount:bars.length,indicatorCount:indicators.length,oscillatorCount:panes.length-1,selectedTrade:trades[selectedIndex]?.id??null,allView});
    details();if(trades.length)focus(false);else full();
  } catch(error) {q('eth-review-error').hidden=false;q('eth-review-error').textContent=error.message;}
})();
</script>
